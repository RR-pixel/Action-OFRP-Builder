name: Recovery Build (vayu)

on:
  workflow_dispatch:
    inputs:
      device_tree_url:
        description: "Device tree URL"
        required: true
        default: "https://github.com/RR-pixel/aera-16.0"
        type: string

      device_tree_branch:
        description: "Device tree branch"
        required: true
        default: "aera-16.0"
        type: string

      vayu_kernel:
        description: "Kernel yang dipakai"
        required: true
        default: "default"
        type: choice
        options:
          - default
          - miui

      publish_release:
        description: "Upload juga ke GitHub Release (tanpa ini hanya jadi artifact)"
        required: true
        default: false
        type: boolean

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    env:
      SYNC_URL: https://github.com/AERA-Recovery/android_manifest.git
      MANIFEST_BRANCH: "aera-16.0"
      DEVICE_TREE_URL: ${{ inputs.device_tree_url }}
      DEVICE_TREE_BRANCH: ${{ inputs.device_tree_branch }}
      DEVICE_PATH: device/xiaomi/vayu
      DEVICE_NAME: vayu
      BUILD_TARGET: recovery
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TZ: Asia/Jakarta
      USE_CCACHE: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 4G
      CCACHE_COMPILERCHECK: content

    steps:

    # Cleanup The Actions Workspace Using Custom Composite Run Actions
    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Create Telegram sender script
      run: |
        cat <<'EOF' > /tmp/send_msg.sh
        #!/bin/bash
        MSG="$(printf '%b' "$1")"
        curl -s --fail \
          -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ env.TELEGRAM_CHAT_ID }}" \
          -d text="$MSG" \
          -d parse_mode="Markdown" \
          -d disable_web_page_preview=true \
        > /dev/null 2>&1 || true
        EOF
        chmod +x /tmp/send_msg.sh

    - name: Initialize workspace
      run: |
        /tmp/send_msg.sh "🚀 *Starting AERA build* for \`${{ env.DEVICE_NAME }}\` (\`${{ env.DEVICE_TREE_BRANCH }}\`, kernel \`${{ inputs.vayu_kernel }}\`)\n🔗 [View Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
      id: pwd

    - name: Prepare the build environment
      run: |
        /tmp/send_msg.sh "🧩 Preparing build environment..."
        curl -fL -O "https://gitlab.com/OrangeFox/misc/scripts/-/raw/master/setup/android_build_env.sh"
        sudo bash android_build_env.sh
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Restore compiler cache
      id: ccache_restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ env.MANIFEST_BRANCH }}-vayu-ccache
      continue-on-error: true

    - name: Install OpenJDK
      uses: actions/setup-java@v6
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Sync AERA sources and minimal manifest
      run: |
        /tmp/send_msg.sh "🌐 Syncing AERA sources..."
        mkdir ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }} && \
          cd ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}
        repo init --depth=1 -u ${{ env.SYNC_URL }} -b ${{ env.MANIFEST_BRANCH }}
        repo sync -c --force-sync --no-clone-bundle --no-tags -j$(nproc)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Get latest bootable/recovery commit
      id: recovery_commit
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}/bootable/recovery
        RECOVERY_COMMIT=$(git rev-parse --short=7 HEAD)
        echo "RECOVERY_COMMIT=$RECOVERY_COMMIT" >> $GITHUB_OUTPUT
        echo "Latest bootable/recovery commit: $RECOVERY_COMMIT"
        /tmp/send_msg.sh "🔁 bootable/recovery: [${RECOVERY_COMMIT}](https://github.com/AERA-Recovery/android_bootable_recovery/tree/${RECOVERY_COMMIT})"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone device tree
      run: |
        /tmp/send_msg.sh "🌲 Cloning device tree for \`${{ env.DEVICE_NAME }}\`..."
        cd ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}
        mkdir -p ${{ env.DEVICE_PATH }}
        git clone --depth=1 ${{ env.DEVICE_TREE_URL }} -b ${{ env.DEVICE_TREE_BRANCH }} ./${{ env.DEVICE_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Get latest device tree commit
      id: devtree_commit
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}/${{ env.DEVICE_PATH }}
        LATEST_COMMIT=$(git rev-parse --short=7 HEAD)
        echo "LATEST_COMMIT=$LATEST_COMMIT" >> $GITHUB_OUTPUT
        echo "Latest device tree commit: $LATEST_COMMIT"
        /tmp/send_msg.sh "🌲 Device tree: [${LATEST_COMMIT}](${{ env.DEVICE_TREE_URL }}/tree/$LATEST_COMMIT)"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 30

    - name: Show system resources
      run: |
        /tmp/send_msg.sh "📊 Checking runner resources..."
        echo "CPU cores:"
        nproc
        echo
        echo "Memory:"
        free -h
        echo
        echo "Disk:"
        df -h
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Building recovery
      run: |
        /tmp/send_msg.sh "⚙️ Starting build for \`${{ env.DEVICE_NAME }}\` (kernel \`${{ inputs.vayu_kernel }}\`)..."
        cd ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}

        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true

        # Limit Go memory pressure during Soong bootstrap
        export GOGC=40
        export GOMEMLIMIT=11GiB
        export GOMAXPROCS=2

        if command -v ccache >/dev/null 2>&1; then
          export USE_CCACHE=1
          export CCACHE_EXEC="$(command -v ccache)"

          mkdir -p "$CCACHE_DIR"

          if ccache -M "$CCACHE_MAXSIZE" && ccache -z; then
            echo "Compiler cache enabled: $CCACHE_EXEC"
          else
            echo "::warning::ccache initialization failed; continuing without cache."
            unset USE_CCACHE CCACHE_EXEC
          fi
        else
          echo "::warning::ccache unavailable; continuing without cache."
          unset USE_CCACHE CCACHE_EXEC
        fi

        # Pilihan kernel vayu (tree memilih lewat FOX_VARIANT=MIUI)
        if [[ "${{ inputs.vayu_kernel }}" == "miui" ]]; then
          export VAYU_KERNEL=miui
          export FOX_VARIANT=MIUI
        else
          export VAYU_KERNEL=default
          unset FOX_VARIANT
        fi
        echo "VAYU_KERNEL=${VAYU_KERNEL} FOX_VARIANT=${FOX_VARIANT:-<unset>}"

        set -e

        if [[ "${{ env.MANIFEST_BRANCH }}" == *"14.1"* ]]; then
          lunch twrp_${{ env.DEVICE_NAME }}-ap2a-eng
        elif [[ "${{ env.MANIFEST_BRANCH }}" == *"16.0"* ]]; then
          lunch twrp_${{ env.DEVICE_NAME }}-bp2a-eng
        fi

        # Monitor disk and memory usage during compilation
        (
          while sleep 120; do
            echo "=== Build resources: $(date -u '+%Y-%m-%d %H:%M:%S UTC') ==="
            df -h /
            free -h
            vmstat 1 2
          done
        ) &
        RESOURCE_MONITOR_PID=$!

        trap 'kill "$RESOURCE_MONITOR_PID" 2>/dev/null || true' EXIT

        if ! mka adbd ${{ env.BUILD_TARGET }}image -j$(nproc --all); then
          /tmp/send_msg.sh "❌ Build failed for \`${{ env.DEVICE_NAME }}\` (\`${{ env.DEVICE_TREE_BRANCH }}\`, kernel \`${{ inputs.vayu_kernel }}\`)\n🔗 [View Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          exit 1
        fi
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Show compiler cache statistics
      run: |
        if command -v ccache >/dev/null 2>&1; then
          echo "=== Compiler cache statistics ==="
          ccache_stats="$(ccache -s)"
          echo "$ccache_stats"
          /tmp/send_msg.sh "📊 *Compiler cache statistics*\n\`$ccache_stats\`"
          echo "=== Compiler cache disk usage ==="
          du -sh "$CCACHE_DIR" 2>/dev/null || true
        fi

    - name: Show system resources post-build
      run: |
        /tmp/send_msg.sh "📊 Checking runner resources after build..."
        echo "CPU cores:"
        nproc
        echo
        echo "Memory:"
        free -h
        echo
        echo "Disk:"
        df -h
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Save compiler cache
      if: success() && steps.ccache_restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ env.MANIFEST_BRANCH }}-vayu-ccache
      continue-on-error: true

    - name: Upload build artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: AERA-16.0-${{ env.DEVICE_NAME }}-${{ inputs.vayu_kernel }}-UNTESTED
        path: |
          ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/AERA-R*.img
          ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/AERA-R*.zip
          ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/${{ env.BUILD_TARGET }}.img
        if-no-files-found: warn

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ env.DEVICE_NAME }}-${{ inputs.vayu_kernel }}
        path: |
          ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}/out/error.log
          ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}/out/verbose.log.gz
        if-no-files-found: ignore

    - name: Upload to Release
      if: ${{ inputs.publish_release }}
      uses: softprops/action-gh-release@v3
      with:
        files: |
          ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/AERA-R*.img
          ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/AERA-R*.zip
          ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/${{ env.BUILD_TARGET }}.img
        fail_on_unmatched_files: true
        name: ${{ env.DEVICE_NAME }}-${{ inputs.vayu_kernel }}-${{ env.DEVICE_TREE_BRANCH }}-${{ steps.devtree_commit.outputs.LATEST_COMMIT }}
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ env.MANIFEST_BRANCH }}
          Device: ${{ env.DEVICE_NAME }}
          Kernel: ${{ inputs.vayu_kernel }}
          Target: ${{ env.BUILD_TARGET }}
          Device tree branch: ${{ env.DEVICE_TREE_BRANCH }}
          Device tree commit: [${{ steps.devtree_commit.outputs.LATEST_COMMIT }}](${{ env.DEVICE_TREE_URL }}/tree/${{ steps.devtree_commit.outputs.LATEST_COMMIT }})
          bootable/recovery commit: [${{ steps.recovery_commit.outputs.RECOVERY_COMMIT }}](https://github.com/AERA-Recovery/android_bootable_recovery/tree/${{ steps.recovery_commit.outputs.RECOVERY_COMMIT }})
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Notify complete
      if: success()
      run: |
        RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        DEVICE_TREE_BROWSE_URL="${{ env.DEVICE_TREE_URL }}/tree/${{ steps.devtree_commit.outputs.LATEST_COMMIT }}"
        RECOVERY_BROWSE_URL="https://github.com/AERA-Recovery/android_bootable_recovery/tree/${{ steps.recovery_commit.outputs.RECOVERY_COMMIT }}"
        /tmp/send_msg.sh "📦 *Build complete!* (kernel \`${{ inputs.vayu_kernel }}\`)\n🔗 [Download]($RUN_URL)\n🌲 Device tree branch: \`${{ env.DEVICE_TREE_BRANCH }}\`\n🌲 Device tree commit: [${{ steps.devtree_commit.outputs.LATEST_COMMIT }}]($DEVICE_TREE_BROWSE_URL)\n🔁 bootable/recovery commit: [${{ steps.recovery_commit.outputs.RECOVERY_COMMIT }}]($RECOVERY_BROWSE_URL)"

    - name: Notify Workflow end
      if: always()
      run: |
        /tmp/send_msg.sh "🏁 *Workflow ended*\n🔗 [View Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
